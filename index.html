<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCHAT</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<!-- Handwriting Font applied as requested -->
<link href="https://googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg:#000000;
    --panel:#111111;
    --panel2:#1a1a1a;
    --text:#FFFFFF;
    --muted:#aaaaaa;
    --accent:#25d366;
    --green:#00D084;
    --danger:#FF5364;
    --border:#2c2c2c;
    --bubble:#1a1a1a;
}

* {
    box-sizing:border-box;
    font-family: 'Caveat', 'Comic Sans MS', cursive, sans-serif;
    font-size: 20px;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,input,textarea,select {
    font:inherit;
}

button {
    cursor:pointer;
}

button:disabled {
    opacity:.5;
    cursor:not-allowed;
}

.hidden {
    display:none !important;
}

.muted {
    color:var(--muted);
}

.small {
    font-size:16px;
}

.primary-btn {
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#000;
    font-weight:bold;
}

.secondary-btn {
    padding:11px 15px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:var(--text);
}

.danger-btn {
    background:transparent;
    color:var(--danger);
    border:1px solid var(--danger);
    border-radius:9px;
    padding:11px 15px;
}

input,textarea,select {
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:var(--text);
    outline:none;
    margin:7px 0 14px;
}

input:focus,textarea:focus,select:focus {
    border-color:var(--accent);
}

label {
    color:var(--muted);
    font-size:18px;
}

hr {
    border:0;
    border-top:1px solid var(--border);
    margin:20px 0;
}

.auth-screen {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-card {
    width:100%;
    max-width:430px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
    box-shadow:0 15px 50px #000a;
}

.logo {
    text-align:center;
    font-size:42px;
    font-weight:900;
    letter-spacing:3px;
    color:var(--accent);
    margin:8px 0;
}

.auth-subtitle {
    text-align:center;
    color:var(--muted);
    margin-bottom:25px;
}

.auth-switch {
    text-align:center;
    margin-top:18px;
    color:var(--muted);
}

.auth-switch button {
    color:var(--accent);
    border:0;
    background:none;
    font-weight:bold;
}

#authMessage {
    color:var(--danger);
    text-align:center;
    font-size:16px;
    min-height:20px;
}

/* MAIN APPLICATION */
#appScreen {
    display:none;
    height:100dvh;
    overflow:hidden;
}

.app-layout {
    display:flex;
    width:100%;
    height:100%;
}

.sidebar {
    width:370px;
    min-width:300px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}

.sidebar-header {
    padding:17px;
    border-bottom:1px solid var(--border);
}

.topbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.brand {
    color:var(--accent);
    font-weight:900;
    font-size:28px;
    letter-spacing:2px;
}

.icon-btn {
    width:39px;
    height:39px;
    border:0;
    border-radius:50%;
    background:var(--panel2);
    color:var(--text);
    font-size:19px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.search-box {
    margin-top:14px;
}

.search-box input {
    margin:0;
    border-radius:22px;
}

.filter-row {
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:12px 15px;
}

.filter-btn {
    flex-shrink:0;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--muted);
    border-radius:20px;
    padding:8px 13px;
    font-size:16px;
}

.filter-btn.active {
    background:var(--accent);
    color:#000;
    border-color:var(--accent);
}

.chat-list {
    flex:1;
    overflow-y:auto;
}

.chat-item {
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #ffffff08;
    cursor:pointer;
}

.chat-item:hover {
    background:var(--panel2);
}

.avatar {
    width:48px;
    height:48px;
    border-radius:50%;
    background:#2c2c2c;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    font-size:19px;
    font-weight:bold;
    flex-shrink:0;
    overflow:hidden;
}

.avatar img {
    width:100%;
    height:100%;
    object-fit:cover;
}

.chat-item-info {
    flex:1;
    min-width:0;
}

.chat-item-name {
    font-weight:bold;
    margin-bottom:6px;
}

.chat-item-preview {
    color:var(--muted);
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-item-time {
    color:var(--muted);
    font-size:14px;
}

.main-area {
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
}

.welcome-screen {
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.welcome-screen h1 {
    color:var(--accent);
    letter-spacing:3px;
    font-size:36px;
}

.welcome-screen p {
    color:var(--muted);
}

.chat-screen {
    height:100%;
    display:flex;
    flex-direction:column;
}

.chat-header {
    min-height:70px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 15px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.chat-header-info {
    flex:1;
    min-width:0;
}

.chat-header-name {
    font-weight:bold;
}

.chat-header-status {
    color:var(--muted);
    font-size:16px;
    margin-top:4px;
}

.chat-header-actions {
    display:flex;
    gap:7px;
}

.messages-area {
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background-color:var(--bg);
}

.message-row {
    display:flex;
    width:100%;
}

.message-row.mine {
    justify-content:flex-end;
}

.message-bubble {
    max-width:min(75%,520px);
    padding:10px 12px;
    border-radius:12px;
    background:var(--bubble);
    overflow-wrap:anywhere;
}

.message-row.mine .message-bubble {
    background:#075C50;
}

.message-text {
    white-space:pre-wrap;
    line-height:1.4;
}

.message-meta {
    display:flex;
    justify-content:flex-end;
    gap:6px;
    color:#b7c4cc;
    font-size:12px;
    margin-top:6px;
}

.delivery-dots {
    letter-spacing:-2px;
}

.date-divider {
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin:12px 0;
}

.message-composer {
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    background:var(--panel);
    border-top:1px solid var(--border);
}

.message-composer input {
    flex:1;
    margin:0;
    border-radius:22px;
}

.composer-btn {
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:var(--panel2);
    color:var(--text);
    font-size:19px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.send-btn {
    background:var(--accent);
    color:#000;
}

/* PANELS AND MENUS */
.panel-overlay {
    position:fixed;
    inset:0;
    background:#0009;
    z-index:20;
    display:flex;
    justify-content:flex-end;
}

.side-panel {
    width:min(430px,100%);
    height:100%;
    overflow-y:auto;
    background:var(--panel);
    padding:20px;
    border-left:1px solid var(--border);
}

.panel-heading {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
}

.panel-heading h2 {
    flex:1;
    margin:0;
    font-size:26px;
}

.settings-row {
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    text-align:left;
    padding:15px 12px;
    margin:5px 0;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:9px;
    cursor:pointer;
}

.settings-row small {
    display:block;
    color:var(--muted);
    margin-top:5px;
    font-size:15px;
}

.settings-section {
    margin:20px 0;
}

.settings-section h3 {
    color:var(--accent);
    font-size:18px;
    margin-bottom:10px;
}

.menu-popup {
    position:fixed;
    z-index:50;
    right:12px;
    top:65px;
    width:220px;
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:0 10px 35px #0008;
    border-radius:12px;
    padding:7px;
}

.menu-popup button {
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:0;
    color:var(--text);
    padding:10px;
    border-radius:6px;
}

.menu-popup button:hover {
    background:var(--panel2);
}

.device-card, .list-card {
    background-color: var(--panel2);
    border: 1px solid var(--border);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen" class="auth-screen">
    <div class="auth-card">
        <div class="logo">KCHAT</div>
        <div id="authSubtitle" class="auth-subtitle">Login to your account</div>
        
        <div id="phoneGroup" class="form-group hidden">
            <label>Phone Number</label>
            <input type="text" id="authPhone" placeholder="+256 700 000000">
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="authPassword" placeholder="••••••••">
        </div>
        
        <div id="authMessage"></div>
        
        <button id="authBtn" class="primary-btn" onclick="handleAuth()">Sign In</button>
